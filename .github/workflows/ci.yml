name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      
      - name: Lint with Ruff
        run: ruff check .
      
      - name: Type check with MyPy
        run: mypy . --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e .
          fi
          pip install pytest pytest-cov
      
      - name: Test with pytest
        run: |
          pytest tests/ -v --cov=. --cov-report=xml || true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets in code
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r "password\s*=\s*['\"][^'\"]\+['\"]" --include="*.py" . 2>/dev/null | grep -v "__pycache__" | grep -v ".git"; then
            echo "::warning::Possible hardcoded password found!"
          fi
          if grep -r "api_key\s*=\s*['\"][^'\"]\+['\"]" --include="*.py" . 2>/dev/null | grep -v "__pycache__" | grep -v ".git"; then
            echo "::warning::Possible hardcoded API key found!"
          fi
          if grep -r "secret\s*=\s*['\"][^'\"]\+['\"]" --include="*.py" . 2>/dev/null | grep -v "__pycache__" | grep -v ".git" | grep -v "test"; then
            echo "::warning::Possible hardcoded secret found!"
          fi
          echo "Secret scanning completed."
